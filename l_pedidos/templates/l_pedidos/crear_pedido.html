{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear Pedido</title>
    <link rel="stylesheet" href="{% static 'css/sb-admin-2.min.css' %}">
</head>
<body>
<div class="container mt-5">
    <h2 class="text-success mb-4">Nuevo Pedido</h2>

    <form method="post">
        {% csrf_token %}

        
        <div class="card shadow mb-4">
            <div class="card-header bg-success text-white">
                <h5 class="m-0">Datos del Pedido</h5>
            </div>
            <div class="card-body">
                {{ pedido_form.as_p }}
            </div>
        </div>

        
        <div class="card shadow mb-4">
            <div class="card-header bg-secondary text-white">
                <h5 class="m-0">Detalle del Producto</h5>
            </div>
            <div class="card-body">
                {{ detalle_form.as_p }}
            </div>
        </div>

        <div class="mt-3">
            <button type="submit" class="btn btn-success">Crear Pedido</button>
            <a href="{% url 'lista_pedidos' %}" class="btn btn-outline-secondary">Cancelar</a>
            <a href="{% url 'lista_pedidos' %}" class="btn btn-outline-primary ml-2">← Ver Pedidos</a>
        </div>
    </form>
</div>
</body>
</html>
